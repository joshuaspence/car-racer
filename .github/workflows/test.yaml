---
name: 'Test'

on:
  pull_request: {}
  push:
    branches: ['master']

permissions:
  contents: 'read'

jobs:
  test:
    name: 'Unit Tests'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v4.4.0'

      - uses: 'actions/setup-dotnet@v4.3.1'
        with:
          dotnet-version: '8.0.x'

      - run: 'dotnet test dotnet/CarRacer.sln --configuration Release'
