name: Unity

# Unity tests and a development APK for every PR. Needs the UNITY_LICENSE, UNITY_EMAIL and
# UNITY_PASSWORD secrets (see docs/ci-setup.md); without them these jobs are skipped.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: unity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  licence:
    name: Check Unity licence
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::UNITY_LICENSE is not set, so Unity tests and builds are skipped. See docs/ci-setup.md."
          fi

  test:
    name: Unity tests
    needs: licence
    if: needs.licence.outputs.available == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Unity/Library
          key: Library-test-${{ hashFiles('Unity/Assets/**', 'Unity/Packages/**', 'Unity/ProjectSettings/**') }}
          restore-keys: Library-test-

      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Unity
          testMode: all
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity test results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-test-results
          path: ${{ steps.tests.outputs.artifactsPath }}

  android:
    name: Android development APK
    needs: licence
    if: needs.licence.outputs.available == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # The Unity Android image is large; make room on the runner.
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false

      - uses: actions/cache@v4
        with:
          path: Unity/Library
          key: Library-android-${{ hashFiles('Unity/Assets/**', 'Unity/Packages/**', 'Unity/ProjectSettings/**') }}
          restore-keys: Library-android-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Unity
          targetPlatform: Android
          buildName: CarRacer
          buildMethod: CarRacer.Editor.BuildScript.BuildFromCommandLine
          customParameters: -carRacerDevelopment
          androidExportType: androidPackage
          versioning: Semantic

      - uses: actions/upload-artifact@v4
        with:
          name: CarRacer-dev-apk
          path: build/Android/*.apk
          if-no-files-found: error
